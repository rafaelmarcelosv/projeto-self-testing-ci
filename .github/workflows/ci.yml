name: Wallet API CI
on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Static analysis
        run: python -m ruff check src tests
      - name: Run tests with branch coverage
        run: python -m pytest tests/unit tests/integration tests/e2e --cov=src --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov
      - name: Enforce line and branch coverage
        run: |
          python - <<'PYCODE'
          import json
          import subprocess
          report = json.loads(subprocess.check_output(['python', '-m', 'coverage', 'json', '-o', '-']))
          totals = report['totals']
          lines = totals['covered_lines'] / totals['num_statements'] * 100
          branches = totals['covered_branches'] / totals['num_branches'] * 100 if totals['num_branches'] else 100
          print(f'Lines: {lines:.2f}%; Branches: {branches:.2f}%')
          if lines < 85 or branches < 80:
              raise SystemExit('Coverage gate failed')
          PYCODE
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
